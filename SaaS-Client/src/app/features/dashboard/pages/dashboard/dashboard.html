<div class="min-h-screen bg-gray-100">
  <nav class="bg-indigo-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-8">
          <div class="flex-shrink-0 flex items-center">
            <span class="text-xl font-black tracking-tighter uppercase">SaaS<span class="text-indigo-300">Core</span></span>
          </div>
          <div class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-4">
              <a routerLink="/dashboard" class="hover:bg-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Home</a>
              <a routerLink="/dashboard/customers" class="hover:bg-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Customers</a>
            </div>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="text-right hidden sm:block">
            <p class="text-xs text-indigo-200 uppercase font-bold">Tenant: {{ tenantId() }}</p>
            <p class="text-sm font-medium">{{ userName() }}</p>
          </div>
          <button (click)="logout()" class="bg-indigo-800 hover:bg-red-600 p-2 rounded-full transition-all group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
      <router-outlet></router-outlet>
  </main>
  <app-toast></app-toast>
</div>

@if (toastService.show()) {
  <div class="fixed bottom-5 right-5 z-[100] animate-fadeIn">
    <div [class]="toastService.type() === 'success' ? 'bg-green-600' : 'bg-red-600'"
         class="flex items-center space-x-3 px-6 py-3 rounded-2xl shadow-2xl text-white border border-white/20">
      <span>{{ toastService.type() === 'success' ? '✅' : '❌' }}</span>
      <p class="font-bold text-sm">{{ toastService.message() }}</p>
    </div>
  </div>
}
